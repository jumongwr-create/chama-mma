<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="600">
  <title>CHAMA!</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --card-hover: #f7f7f7;
      --text: #111111;
      --muted: #666666;
      --border: #e5e5e5;
      --accent: #111111;
      --header-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --card: #111111;
      --card-hover: #1a1a1a;
      --text: #f0f0f0;
      --muted: #999999;
      --border: #222222;
      --accent: #ffffff;
      --header-bg: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status { font-size: 0.8rem; color: var(--muted); }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover { background: var(--card-hover); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .source {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .source-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.25rem;
    }

    .source-header h2 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .source-header a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
    }

    .source-header a:hover { color: var(--text); }

    .card {
      display: flex;
      gap: 1rem;
      padding: 0.8rem 0;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .card:last-child { border-bottom: none; }
    .card:hover { background: var(--card-hover); }

    .thumb {
      width: 96px;
      height: 68px;
      object-fit: cover;
      object-position: center top;
      border-radius: 8px;
      background: var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
    }

    /* Rankings */
    .rankings {
      max-width: 1200px;
      margin: 3rem auto 0;
      padding: 2rem 1.5rem 0;
      border-top: 1px solid var(--border);
    }

    .rankings h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .rankings .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.75rem;
    }

    .rank-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.1rem;
    }

    .rank-card-header {
      margin-bottom: 0.75rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--border);
    }

    .rank-card h3 {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0;
    }

    /* Matchmaking */
    .matchmaking {
      margin-top: 2.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
    }

    .matchmaking h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">CHAMA!</div>
      <div class="controls">
        <span class="status" id="last-updated">just now</span>
        <button id="theme-toggle" onclick="toggleTheme()">Dark</button>
        <button onclick="location.reload()">Refresh</button>
      </div>
    </div>
  </header>

  <main>
    <div class="note">
      Verified sources only · Auto-refreshes every 10 minutes · Feeds update via GitHub Actions
    </div>

    <!-- Dynamic feeds will be injected here -->
    <div class="sources" id="sources">
      <p style="color:var(--muted)">Loading feeds…</p>
    </div>

    <!-- Future Matchmaking -->
    <div class="matchmaking">
      <h2>Future Matchmaking · Grok Analysis</h2>
      <p class="sub" id="mm-note">Loading latest analysis…</p>
      <div class="rank-grid" id="mm-grid" style="gap: 1.25rem;"></div>
    </div>
  </main>

  <footer>
    CHAMA! — UFC · MMA Fighting · Sherdog · Powered by GitHub Actions
  </footer>

  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        btn.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      }
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-toggle').textContent = 'Light';
    }

    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // ===== Dynamic Feeds Loader =====
    async function loadFeeds() {
      const container = document.getElementById('sources');
      if (!container) return;

      try {
        const res = await fetch('feeds.json?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load feeds.json');

        const data = await res.json();
        const sources = data.sources || [];

        if (sources.length === 0) {
          container.innerHTML = '<p style="color:var(--muted)">No feeds available yet. Wait for the GitHub Action to run.</p>';
          return;
        }

        container.innerHTML = sources.map(source => {
          const cards = (source.items || []).map(item => {
            const thumb = item.image
              ? `<img class="thumb" src="${item.image}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'thumb\\'>No image</div>'">`
              : `<div class="thumb">No image</div>`;

            const meta = item.relative || (item.date ? new Date(item.date).toLocaleDateString() : '');

            return `
              <a class="card" href="${item.link}" target="_blank" rel="noopener">
                ${thumb}
                <div class="card-body">
                  <div class="card-meta">${meta}</div>
                  <div class="card-title">${escapeHtml(item.title)}</div>
                </div>
              </a>
            `;
          }).join('');

          const siteDisplay = (source.site || '')
            .replace('https://', '')
            .replace('http://', '')
            .replace(/\/$/, '');

          return `
            <section class="source">
              <div class="source-header">
                <h2>${escapeHtml(source.name)}</h2>
                <a href="${source.site}" target="_blank" rel="noopener">${siteDisplay}</a>
              </div>
              ${cards || '<p style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0;">No recent items</p>'}
            </section>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <p style="color:var(--muted)">
            Could not load feeds.<br>
            Make sure <code>feeds.json</code> exists and the GitHub Action has run successfully.
          </p>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // ===== Matchmaking Loader =====
    async function loadMatchmaking() {
      try {
        const res = await fetch('matchmaking.json?t=' + Date.now());
        const data = await res.json();
        document.getElementById('mm-note').textContent =
          'Updated ' + data.updated + ' · ' + data.note;

        const grid = document.getElementById('mm-grid');
        if (!grid) return;

        grid.innerHTML = data.divisions.map(d => `
          <div class="rank-card">
            <div class="rank-card-header"><h3>${d.name}</h3></div>
            <div style="font-size:0.88rem; line-height:1.45;">
              <p style="margin:0 0 0.6rem;"><strong>Next up:</strong> ${d.next}</p>
              <p style="margin:0; color:var(--muted); font-size:0.82rem;">${d.analysis}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        const note = document.getElementById('mm-note');
        if (note) note.textContent = 'Could not load matchmaking data.';
        console.error(err);
      }
    }

    // Start everything
    loadFeeds();
    loadMatchmaking();
  </script>
</body>
</html>
