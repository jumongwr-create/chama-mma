<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="600">
  <title>CHAMA!</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --card-hover: #f7f7f7;
      --text: #111111;
      --muted: #666666;
      --border: #e5e5e5;
      --accent: #111111;
      --header-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --card: #111111;
      --card-hover: #1a1a1a;
      --text: #f0f0f0;
      --muted: #999999;
      --border: #222222;
      --accent: #ffffff;
      --header-bg: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status { font-size: 0.8rem; color: var(--muted); }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    button:hover { background: var(--card-hover); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .source {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .source-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.25rem;
    }

    .source-header h2 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .source-header a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
    }

    .source-header a:hover { color: var(--text); }

    .card {
      display: flex;
      gap: 1rem;
      padding: 0.8rem 0;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .card:last-child { border-bottom: none; }
    .card:hover { background: var(--card-hover); }

    .thumb {
      width: 96px;
      height: 68px;
      object-fit: cover;
      object-position: center top;
      border-radius: 8px;
      background: var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
    }

    /* Rankings */
    .rankings {
      max-width: 1200px;
      margin: 3rem auto 0;
      padding: 2rem 1.5rem 0;
      border-top: 1px solid var(--border);
    }

    .rankings h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .rankings .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.75rem;
    }

    .rank-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem 1.1rem;
    }

    .rank-card-header {
      margin-bottom: 0.75rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--border);
    }

    .rank-card h3 {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    /* === UFC Countdown Topbar === */
    .ufc-countdown-bar {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 57px;
      z-index: 90;
      -webkit-overflow-scrolling: touch;
    }
    .ufc-countdown-bar::-webkit-scrollbar { height: 4px; }
    .ufc-countdown-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .countdown-track {
      display: flex;
      gap: 1rem;
      padding: 0.6rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
    }

    .countdown-item {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 155px;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }
    .countdown-item:hover { border-color: #aaa; }
    [data-theme="dark"] .countdown-item:hover { border-color: #555; }

    .countdown-item .event-name {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 0.1rem;
    }
    .countdown-item .event-main {
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .countdown-item .timer {
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .countdown-item .timer.live {
      color: #e11d48;
    }
    .countdown-item .location {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">CHAMA!</div>
      <div class="controls">
        <span class="status" id="last-updated">just now</span>
        <button id="theme-toggle" onclick="toggleTheme()">Dark</button>
        <button onclick="location.reload()">Refresh</button>
      </div>
    </div>
  </header>

  <!-- UFC Event Countdown Topbar -->
  <div class="ufc-countdown-bar" id="ufc-countdown-bar">
    <div class="countdown-track" id="countdown-track">
      <!-- populated by JS -->
    </div>
  </div>

  <main>
    <div class="note">
      Verified sources only · Auto-refreshes every 10 minutes
    </div>

    <!-- Dynamic feeds will be injected here -->
    <div class="sources" id="sources">
      <p style="color:var(--muted)">Loading feeds…</p>
    </div>
  </main>

  <footer>
    CHAMA! — UFC · MMA Fighting · Sherdog · Powered by GitHub Actions
  </footer>

  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        btn.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      }
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-toggle').textContent = 'Light';
    }

    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // ===== Dynamic Feeds Loader =====
    async function loadFeeds() {
      const container = document.getElementById('sources');
      if (!container) return;

      try {
        const res = await fetch('feeds.json?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load feeds.json');

        const data = await res.json();
        const sources = data.sources || [];

        if (sources.length === 0) {
          container.innerHTML = '<p style="color:var(--muted)">No feeds available yet. Wait for the GitHub Action to run.</p>';
          return;
        }

        container.innerHTML = sources.map(source => {
          const cards = (source.items || []).map(item => {
            const thumb = item.image
              ? `<img class="thumb" src="${item.image}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'thumb\\'>No image</div>'">`
              : `<div class="thumb">No image</div>`;

            const meta = item.relative || (item.date ? new Date(item.date).toLocaleDateString() : '');

            return `
              <a class="card" href="${item.link}" target="_blank" rel="noopener">
                ${thumb}
                <div class="card-body">
                  <div class="card-meta">${meta}</div>
                  <div class="card-title">${escapeHtml(item.title)}</div>
                </div>
              </a>
            `;
          }).join('');

          const siteDisplay = (source.site || '')
            .replace('https://', '')
            .replace('http://', '')
            .replace(/\/$/, '');

          return `
            <section class="source">
              <div class="source-header">
                <h2>${escapeHtml(source.name)}</h2>
                <a href="${source.site}" target="_blank" rel="noopener">${siteDisplay}</a>
              </div>
              ${cards || '<p style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0;">No recent items</p>'}
            </section>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <p style="color:var(--muted)">
            Could not load feeds.<br>
            Make sure <code>feeds.json</code> exists and the GitHub Action has run successfully.
          </p>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }


    // ===== UFC Countdown Topbar =====
    const UFC_EVENTS = [
      {
        name: "UFC Fight Night",
        main: "Moicano vs Nolan",
        date: "2026-10-31T01:00:00Z",
        location: "Las Vegas"
      },
      {
        name: "UFC Fight Night",
        main: "Bonfim vs Brady",
        date: "2026-11-08T01:00:00Z",
        location: "Las Vegas"
      },
      {
        name: "UFC 334",
        main: "Gane vs Hokit",
        date: "2026-11-15T02:00:00Z",
        location: "New York"
      },
      {
        name: "UFC Fight Night",
        main: "Procházka vs Stirling",
        date: "2026-11-21T18:00:00Z",
        location: "Doha"
      },
      {
        name: "UFC 335",
        main: "Oliveira vs Lopes",
        date: "2026-12-13T02:00:00Z",
        location: "Las Vegas"
      },
      {
        name: "UFC 336",
        main: "Van vs Kape",
        date: "2027-01-31T02:00:00Z",
        location: "Toronto"
      }
    ];

    function formatCountdown(ms) {
      if (ms <= 0) return { text: "LIVE / STARTED", live: true };
      const totalSec = Math.floor(ms / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      if (d > 0) return { text: `${d}d ${h}h ${m}m`, live: false };
      if (h > 0) return { text: `${h}h ${m}m ${s}s`, live: false };
      return { text: `${m}m ${s}s`, live: true };
    }

    function renderCountdowns() {
      const track = document.getElementById("countdown-track");
      if (!track) return;

      const now = Date.now();
      const upcoming = UFC_EVENTS
        .map(e => ({ ...e, target: new Date(e.date).getTime() }))
        .filter(e => e.target > now - 6 * 3600 * 1000)
        .sort((a, b) => a.target - b.target);

      track.innerHTML = upcoming.map(e => {
        const { text, live } = formatCountdown(e.target - now);
        return `
          <div class="countdown-item">
            <div class="event-name">${e.name}</div>
            <div class="event-main">${e.main}</div>
            <div class="timer ${live ? "live" : ""}">${text}</div>
            <div class="location">${e.location}</div>
          </div>
        `;
      }).join("");
    }

    renderCountdowns();
    setInterval(renderCountdowns, 1000);


    // Start everything
    loadFeeds();
  </script>
</body>
</html>
